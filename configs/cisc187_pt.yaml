# LLaMA-Factory training config for the cisc187 fine-tune.
# Run from the air_gapped_llm repo root:
#   cd ~/air_gapped_llm
#   python3.11 scripts/run_train.py configs/cisc187_pt.yaml
# (or with ipexrun / numactl wrappers — see README Step 4f).
#
# Current base = Llama-3.2-1B-Instruct (POC pipeline-validation run — fast
# iteration to prove data prep → train → merge → GGUF → Ollama works
# end-to-end before committing to the slower 3B run).
# Expected runtime on a 2019 i9 Mac CPU: ~3–6 h for 5 epochs with packing on.
# Pre-flight: confirm ≥8 GB free RAM before launching (Llama-3.2-1B at FP32
# needs ~4 GB for the model alone + activations + LoRA optimizer state).
#
# To scale up to the production-quality 3B run after the POC succeeds:
#   1. Download the 3B base:
#        cd ~/llf-bundle && hf download unsloth/Llama-3.2-3B-Instruct \
#                                       --local-dir Llama-3.2-3B-Instruct
#   2. Edit this file: model_name_or_path → /Users/<you>/llf-bundle/Llama-3.2-3B-Instruct
#   3. Edit this file: output_dir → /Users/<you>/llf-bundle/output/llama-3.2-3b-cisc187-lora
#   4. Edit this file: num_train_epochs: 5.0 → 3.0 (3B needs fewer passes than 1B)
#   5. Budget ≥30 GB free RAM and ~20–24 h.
#   6. Rename modelfiles/Modelfile.llama-3.2-1b-cisc187 → Modelfile.llama-3.2-3b-cisc187
#      and swap 1b → 3b in the FROM path + tag refs.

### model
# Absolute path to the HF-format model dir (NOT the GGUF). Pull with:
#   cd ~/llf-bundle && hf download unsloth/Llama-3.2-1B-Instruct --local-dir Llama-3.2-1B-Instruct
# (unsloth/ namespace re-uploads Meta's weights verbatim and is ungated — no
# HF login or license-acceptance required. For the official Meta source use
# meta-llama/Llama-3.2-1B-Instruct, which requires `hf auth login` first.)
model_name_or_path: /Users/pascaljardin/llf-bundle/Llama-3.2-1B-Instruct
trust_remote_code: false

# CPU-only torch can't use the meta-tensor loading path (it triggers
# torch.cuda._lazy_init() which fails with "Torch not compiled with CUDA
# enabled"). Disable it so the model loads via the normal full-tensor path.
# For 1B that means one ~4 GB allocation at load time — make sure you have
# at least 8 GB free RAM before launching. For 3B bump that to ≥30 GB.
low_cpu_mem_usage: false

### method
stage: pt                        # continued pretraining (next-token loss on raw text)
do_train: true
finetuning_type: lora
lora_target: all                 # apply LoRA to all linear layers; safer than guessing
lora_rank: 32                    # Works for both 1B and 3B. 1B has less native
                                 # capacity than 3B but the textbook corpus is
                                 # small (~150K tokens), so rank 32 is enough adapter
                                 # to memorize it. Bump to 64 if you scale up the
                                 # corpus or see the loss curve plateauing too early.
lora_alpha: 64                   # = 2 * lora_rank (standard ratio)
lora_dropout: 0.05               # mild regularization to dampen overfit on small corpus

### dataset
dataset: cisc187_pt              # must match the key in dataset_info.json
# ABSOLUTE path to the folder containing the edited dataset_info.json.
# LLaMA-Factory does NOT expand `~` here — it passes the raw string to
# open(), so a leading `~/` results in FileNotFoundError. Use /Users/...
# on macOS or /home/<user>/... on Linux.
dataset_dir: /Users/pascaljardin/llf-bundle/LLaMA-Factory/data/
cutoff_len: 2048                 # captures longer textbook files in single sequences
                                 # and packs more docs per packed window.
max_samples: 100000              # cap if your repo is huge; otherwise harmless
preprocessing_num_workers: 4
packing: true                    # concatenate short docs with EOS into full
                                 # cutoff_len sequences. Huge throughput win — cisc187
                                 # has many short files; without packing each sequence
                                 # is padded, wasting CPU on padding.

### output
# ABSOLUTE path. Using a relative path here means the adapter lands wherever
# you ran training from, and Step 4g's `llamafactory-cli export` can't find it
# unless you remember to cd there. Pin it to a known location under llf-bundle.
output_dir: /Users/pascaljardin/llf-bundle/output/llama-3.2-1b-cisc187-lora
overwrite_output_dir: true
logging_steps: 10
save_steps: 200
plot_loss: true

### train
# Force CPU regardless of MPS/CUDA detection. Without this, on a Mac the
# trainer detects MPS and then trips `Torch not compiled with CUDA enabled`
# inside the training loop. On Linux x86_64 with no GPU, this is also the
# correct setting; it just makes the intent explicit.
use_cpu: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 5.0            # 1B has less native capacity than 3B, so it needs
                                 # more passes to memorize. 5 epochs ≈ what 3 epochs
                                 # of 3B would give for memorization. Each epoch is
                                 # ~1 h on Mac CPU, so total ~5 h. Bump to 7 if the
                                 # loss curve in trainer_log.jsonl is still dropping
                                 # at epoch 5; drop to 3 for an even faster POC.
learning_rate: 2.0e-4            # standard LoRA CPT LR; same value works for 1B and 3B.
lr_scheduler_type: cosine
warmup_ratio: 0.03

# Mixed precision — leave both off for the safest CPU default (fp32).
# Flip bf16 to true ONLY if `grep amx /proc/cpuinfo` shows AMX support
# (Sapphire Rapids / Emerald Rapids / EPYC Genoa+). i9-9980HK doesn't have it.
bf16: false
fp16: false
